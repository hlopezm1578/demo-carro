                  $ref: '#/components/schemas/ProductoAdmin'
        '401':
          description: Sin sesión, o token inválido/expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: Credenciales incorrectas
        '403':
          description: Con sesión, pero sin rol admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: Requiere rol admin
    post:
      tags: [Administración]
      summary: Crear un producto
      description: |
        ADMN-01 · Requiere sesión con rol admin (Bearer). El producto nuevo
        nace SIEMPRE activo (D-52): el cuerpo es ProductoCrear, sin campo
        de estado comercial. Familia fuera del enum, precio o stock
        negativos, o campos faltantes → 422 declarativo (Pydantic), sin
        código manual.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductoCrear'
      responses:
        '201':
          description: Producto creado — activo por nacimiento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductoAdmin'
        '401':
          description: Sin sesión, o token inválido/expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: Credenciales incorrectas
        '403':
          description: Con sesión, pero sin rol admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: Requiere rol admin
        '422':
          description: Cuerpo mal formado (familia fuera del enum, precio o stock negativos, campos faltantes) — validación declarativa (Pydantic)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/admin/productos/{producto_id}:
    put:
      tags: [Administración]
      summary: Editar un producto (allow-list sin activo ni id)
      description: |
        ADMN-01 · Requiere sesión con rol admin (Bearer). El cuerpo es
        ProductoEditar: la allow-list de campos editables, SIN id (el id es
        del path) y SIN campo de estado comercial — el toggle activo vive
        en su propio endpoint (D-52). Lo que el cuerpo no puede llevar, el
        mass assignment no puede voltear: sin model_dump ciego sobre el
        ORM.
      security:
        - bearerAuth: []
      parameters:
        - name: producto_id
          in: path
          required: true
          description: Id del producto a editar
          schema: { type: integer }
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductoEditar'
      responses:
        '200':
          description: El producto actualizado, tal como queda en la trastienda
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductoAdmin'
        '401':
          description: Sin sesión, o token inválido/expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: Credenciales incorrectas
        '403':
          description: Con sesión, pero sin rol admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: Requiere rol admin
        '404':
          description: Producto inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: Producto no encontrado
        '422':
          description: Cuerpo mal formado (familia fuera del enum, precio o stock negativos) — validación declarativa (Pydantic)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/admin/productos/{producto_id}/activo:
    patch:
      tags: [Administración]
      summary: Alternar el estado comercial de un producto (soft delete reversible)
      description: |
        ADMN-01, D-52 · Requiere sesión con rol admin (Bearer). El PRIMER
        PATCH del proyecto, y no es casualidad: alterna exactamente UN
        campo. Desactivar saca el producto del catálogo público y de las
        fichas sin destruir su historial (soft delete de docs/03 §2.3.5):
        los pedidos viejos siguen mostrando su snapshot (D-36). Reactivar
        lo devuelve. El toggle es una escritura PROPIA — por eso no vive en
        el editor (ProductoEditar no tiene el campo).
      security:
        - bearerAuth: []
      parameters:
        - name: producto_id
          in: path
          required: true
          description: Id del producto cuyo estado comercial se alterna
          schema: { type: integer }
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: El nuevo estado comercial — un solo campo, la escritura propia del toggle (D-52)
              properties:
                activo:
                  type: boolean
                  description: true reactiva el producto en el catálogo público; false lo esconde (soft delete)
                  example: false
              required: [activo]
      responses:
        '200':
          description: El producto con su nuevo estado comercial
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductoAdmin'
        '401':
          description: Sin sesión, o token inválido/expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: Credenciales incorrectas
        '403':
          description: Con sesión, pero sin rol admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: Requiere rol admin
        '404':
          description: Producto inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: Producto no encontrado
        '422':
          description: Cuerpo mal formado (falta el booleano activo) — validación declarativa (Pydantic)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/admin/pedidos:
    get:
      tags: [Administración]
      summary: Listar TODOS los pedidos del panel
      description: |
        ADMN-03 · Requiere sesión con rol admin (Bearer). La dueña ve el
        negocio entero: TODAS las órdenes de TODAS las clientas, la más
        reciente primero (orden por id descendente) — sin el filtro por
        dueña del token que rige `/api/pedidos`. Cada fila suma el email
        de la clienta dueña del pedido (visible solo para admin).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Todos los pedidos del sistema, el más reciente primero
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PedidoAdmin'
        '401':
          description: Sin sesión, o token inválido/expirado
          content:
