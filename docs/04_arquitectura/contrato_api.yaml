              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: Credenciales incorrectas
        '403':
          description: Con sesión, pero sin rol admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: Requiere rol admin

  /api/admin/pedidos/{numero}/estado:
    patch:
      tags: [Administración]
      summary: Transicionar un pedido — la única transición manual del sistema
      description: |
        ADMN-03, D-50 · Requiere sesión con rol admin (Bearer). El backend
        valida la transición pedida contra la máquina de estados: el admin
        posee exactamente UNA transición manual — PENDING → CANCELLED, la
        gestión de las huérfanas que la fase 3 dejó visibles "en curso".
        Las demás transiciones pertenecen al flujo de pago
        (ADR-012/ADR-013) y PAID es terminal en v1 (refund = ADMN-05,
        diferido a v2). Cancelar una PENDING NO toca stock (D-35: nunca se
        descontó). Una transición ilegal responde 409: es un conflicto de
        ESTADO del recurso, no un dato mal formado — el cuerpo
        {estado: cancelled} es sintácticamente válido, pero el pedido ya
        no está donde se pide.
      security:
        - bearerAuth: []
      parameters:
        - name: numero
          in: path
          required: true
          description: Número público legible de la orden (D-37)
          schema:
            type: string
          example: MAURA-000001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PedidoTransicion'
      responses:
        '200':
          description: El pedido transicionado, con su nuevo estado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PedidoAdmin'
        '401':
          description: Sin sesión, o token inválido/expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: Credenciales incorrectas
        '403':
          description: Con sesión, pero sin rol admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: Requiere rol admin
        '404':
          description: Pedido inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: Pedido no encontrado
        '409':
          description: Transición ilegal — el pedido ya no está en curso (la máquina de estados la rechaza, D-50)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: Ese pedido ya no está en curso.
        '422':
          description: Cuerpo mal formado (estado fuera del enum de PedidoTransicion) — validación declarativa (Pydantic)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/admin/metricas:
    get:
      tags: [Administración]
      summary: Las métricas del panel (reemplaza al endpoint demo /api/admin/estado)
      description: |
        ADMN-04, D-54 · Requiere sesión con rol admin (Bearer). Los cuatro
        KPI de la dueña: ingresos (suma de PAID), pedidos por estado, top
        5 por unidades y stock bajo — computados sobre pedidos y líneas
        snapshot.

        **Evolución narrada (0.4.0):** este endpoint REEMPLAZA al demo
        `/api/admin/estado` de la fase 2, que se retira del contrato —
        cumplió su lección de hacer verificable el 403 por rol (D-33) y
        deja el puesto a la administración de verdad (D-54). Las guías 05
        y 06 que lo construyeron no se re-editan: el endpoint demo vive en
        la historia del proyecto como se le enseñó, con su lección intacta.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Los cuatro KPI del panel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metricas'
        '401':
          description: Sin sesión, o token inválido/expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: Credenciales incorrectas
        '403':
          description: Con sesión, pero sin rol admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: Requiere rol admin

  /api/checkout:
    post:
      tags: [Pago]
      summary: Iniciar el pago — validar el carro, crear la orden PENDING y obtener el form de Webpay
      description: |
        PAY-01, CART-03 · Requiere sesión (Bearer) — el pedido es de ESTA
        cuenta (AUTH-04): el usuario dueño sale del token, jamás del cuerpo.
        El servidor recalcula el total con el precio vigente y valida el
        stock sin tocarlo (la segunda barrera de CART-03; la primera es
        RN-09 en pantalla); solo entonces crea la orden PENDING (D-34) y la
        transacción en Webpay. Stock insuficiente en alguna línea, o un aroma
        del carro que ya no está disponible, → 400 con el detalle de la fila
        que no alcanzó.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutCreate'
      responses:
        '201':
          description: Orden PENDING creada — los tres datos del form POST hacia Webpay (PAY-01)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutRespuesta'
        '400':
          description: Stock insuficiente o aroma no disponible — regla de negocio (CART-03); la orden no se crea
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: Stock insuficiente en Brisa de Naranja (quedan 1)
        '401':
          description: Sin sesión, o token inválido/expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: Credenciales incorrectas
        '422':
          description: Cuerpo mal formado (items vacío, cantidad menor a 1) — validación declarativa (Pydantic), sin código manual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/pago/retorno:
    get:
      tags: [Pago]
      summary: Retorno de Webpay (GET) — discriminar el flujo y redirigir a la SPA
      description: |
        PAY-02 · Público por diseño (`security: []`): quien llama NO es la
        SPA — es el navegador de la clienta recién salido del formulario de
        Webpay, sin Bearer; la sesión se retoma después en la SPA. El
        endpoint lee los params y discrimina el flujo por PRESENCIA de
        ellos, jamás por método HTTP (el spike de retorno observó el flujo
        anulado por GET en integración cuando las docs oficiales declaraban
        POST — la presencia de params es la firma estable). Responde
        SIEMPRE un 302 hacia la ruta única de resultado de la SPA.
      security: []
      parameters:
        - name: token_ws
          in: query
          required: false
          description: Presente SOLO en el flujo normal (aprobado o rechazado por la tarjeta) — sin params TBK_*
          schema:
            type: string
        - name: TBK_TOKEN
          in: query
          required: false
          description: Token del flujo anulado por la clienta — llega junto a TBK_ID_SESION y TBK_ORDEN_COMPRA, sin token_ws
          schema:
            type: string
        - name: TBK_ID_SESION
          in: query
          required: false
          description: Id de sesión que el backend envió al create — presente en anulado, timeout y error de formulario
          schema:
            type: string
        - name: TBK_ORDEN_COMPRA
          in: query
          required: false
          description: El buy_order de la transacción (= numero de la orden, D-37) — presente en anulado, timeout y error de formulario
          schema:
            type: string
      responses:
        '302':
          description: |
            Redirección del navegador a la ruta única /pago/resultado de la
            SPA con el resultado como query params (D-42) — el primer
            response no-JSON del contrato: este endpoint le habla al
            NAVEGADOR, no a la SPA. 302 explícito (no 307) para forzar el
            GET del navegador (patrón PRG).
          headers:
            Location:
              description: URL de la SPA con el estado del flujo discriminado y el numero de la orden cuando existe
              schema:
                type: string
                example: http://localhost:5173/pago/resultado?estado=pagado&orden=MAURA-000001
        '400':
          description: Flujo irreconocible (params que no calzan con ningún flujo de Webpay) — defensivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: Retorno de Webpay irreconocible
    post:
      tags: [Pago]
      summary: Retorno de Webpay (POST) — el mismo discriminador, leyendo el form
      description: |
        PAY-02 · Público por diseño (`security: []`). Mismo endpoint y mismo
        discriminador que el GET: Webpay redirige por GET o por POST según
        el flujo y el ambiente, y el método no es confiable como firma —
        solo la PRESENCIA de los params lo es. El cuerpo llega
        form-urlencoded (el mismo parseo del login de la fase 2). En el
        POST el 302 explícito es crítico: un 307 preservaría método+body y
        re-POSTearía el form de Webpay contra la SPA.
      security: []
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              description: Los cuatro params de Webpay, todos opcionales — el flujo se discrimina por PRESENCIA, no por cuál falta
              properties:
                token_ws:
                  type: string
                  description: Presente SOLO en el flujo normal (aprobado o rechazado por la tarjeta)
                  example: 01abd2e7cc25bbf19f3c...
                TBK_TOKEN:
                  type: string
                  description: Token del flujo anulado por la clienta (nombre literal de Transbank)
                TBK_ID_SESION:
                  type: string
                  description: Id de sesión del create — presente en anulado, timeout y error de formulario
                TBK_ORDEN_COMPRA:
                  type: string
                  description: El buy_order de la transacción (= numero de la orden, D-37)
                  example: MAURA-000001
      responses:
        '302':
          description: |
            Redirección del navegador a la ruta única /pago/resultado de la
            SPA con el resultado como query params (D-42) — el primer
            response no-JSON del contrato. En el POST el 302 (no el 307
            default de RedirectResponse) es el que evita que el navegador
            re-POSTee el form de Webpay contra la SPA.
          headers:
            Location:
              description: URL de la SPA con el estado del flujo discriminado y el numero de la orden cuando existe
              schema:
                type: string
                example: http://localhost:5173/pago/resultado?estado=anulado&orden=MAURA-000001
        '400':
          description: Flujo irreconocible (params que no calzan con ningún flujo de Webpay) — defensivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: Retorno de Webpay irreconocible

  /api/pedidos:
    get:
      tags: [Pedidos]
      summary: Listar los pedidos de la clienta
      description: |
        ORDR-01 · Requiere sesión (Bearer). Devuelve TODAS las órdenes de la
        dueña del token, pendientes incluidas, con su estado real (D-48):
        una orden pending ("saltó a Webpay y no volvió") se muestra como
        "en curso" — la honestidad del estado es la lección. El filtro por
        dueña lo hace el servidor (usuario_id del token), nunca el cliente.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Las órdenes de la clienta, la más reciente primero
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrdenLista'
        '401':
          description: Sin sesión, o token inválido/expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: Credenciales incorrectas

  /api/pedidos/{numero}:
    get:
      tags: [Pedidos]
      summary: Ver el detalle de un pedido
      description: |
        ORDR-01 · Requiere sesión (Bearer). El 404 es uniforme a propósito:
        cubre el pedido que NO existe y el pedido que existe pero NO es de
        la clienta — ownership sin revelar existencia (un numero secuencial
        legible sería enumerable de otra forma). El detalle es el mismo
        render del voucher (D-43): líneas con snapshot, total y estado.
      security:
        - bearerAuth: []
      parameters:
        - name: numero
          in: path
          required: true
          description: Número público legible de la orden (D-37) — el mismo que viajó a Webpay como buy_order
          schema:
            type: string
          example: MAURA-000001
      responses:
        '200':
          description: La orden completa con sus líneas snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdenDetalle'
        '401':
          description: Sin sesión, o token inválido/expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: Credenciales incorrectas
        '404':
          description: Pedido inexistente — o existente pero de otra clienta (uniforme a propósito)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: Pedido no encontrado

  /api/asistente:
    post:
      tags: [Asistente]
      summary: Conversar con la asesora de aromas
      description: |
        AIAS-01, AIAS-02, AIAS-03 · **Público por diseño** (`security: []`,
        la segunda aparición del patrón después del retorno de Webpay): la
        asesora atiende a quien navega la tienda, con o sin cuenta (D-59)
        — nadie necesita sesión para que le recomienden un aroma. El
        backend arma el prompt con el catálogo ACTIVO (mini-RAG, D-56),
        el servicio de IA responde JSON estructurado y el backend valida cada id
        contra la BD antes de responder. Sin la API key del asistente en el .env
        del backend el endpoint degrada a 503 amable — la tienda sigue
        100% operativa (D-61); si la cuota del free tier se agota, 429
        también amable y SIN cifras de límites. Los topes de entrada (mensaje y texto del historial 500,
        historial 10) validan en el borde → 422.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatMensaje'
      responses:
        '200':
          description: La recomendación de la asesora — texto + ids ya validados contra el catálogo activo (máximo 3)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatRespuesta'
        '422':
          description: Topes violados (mensaje o texto del historial sobre 500 caracteres, historial sobre 10 mensajes) — validación declarativa (Pydantic)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Cuota del free tier del servicio de IA consumida — traducida a mensaje amable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: La asesora está recibiendo muchas consultas. Espera unos segundos y reintenta.
        '503':
          description: El servicio externo no está disponible (sin API key del asistente en el .env o servicio caído) — degradación deliberada, jamás un 500 crudo (D-61)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: La asesora no está disponible en este momento. Inténtalo más tarde.
