# ============================================================================
# Maura — Contrato de la API (OpenAPI 3.0)
# Fase 1 · API-first (D-15 / ADR-007): este documento es la FUENTE DE LA
# VERDAD de la interfaz. Se aprueba antes de codificar; el backend debe
# implementarlo sin desviarse. Trazabilidad: cada operación cita el
# requisito que la origina (.planning/REQUIREMENTS.md → docs/02_requerimientos.md).
# Probarlo sin backend: importar este archivo en Swagger Editor o Postman.
# ============================================================================
openapi: 3.0.3

info:
  title: Maura API
  version: 0.4.0
  description: |
    API del catálogo de la tienda Maura · Body Splash (tier servidor de los
    dos tiers: la SPA React la consume; el backend solo expone JSON, jamás
    plantillas HTML).

    **Autenticación:** sesión JWT Bearer — `/api/auth/perfil`,
    `/api/checkout`, `/api/pedidos*` y los paths `/api/admin/*` piden token
    (`Authorization: Bearer`); los paths de administración exigen además
    claim de rol admin en el token (clienta con sesión válida → 403). El
    registro y el login son públicos. El retorno de Webpay
    (`/api/pago/retorno`) también es público — por diseño: quien llega es el
    navegador de la clienta recién salido del formulario de Webpay, sin
    Bearer; la sesión se retoma después en la SPA. El asistente de venta
    (`/api/asistente`) es público igual que el retorno: la asesora atiende
    a quien navega la tienda, con o sin cuenta (D-59). El token lo emite
    `/api/auth/login` y vive 7 días (D-20); no existe endpoint de
    renovación (D-19).

    **Evolución de esta versión (0.4.0):** el endpoint demo
    `/api/admin/estado` de la fase 2 SE RETIRA del contrato — cumplió su
    lección (hacer verificable el 403 por rol, D-33) y los endpoints
    reales de administración toman su puesto (D-54); la evolución se narra
    en la description de `GET /api/admin/metricas`. Las guías que lo
    construyeron no se re-editan: la historia del contrato es la historia
    de la tienda.

    **Convención de errores:**

    | Código | Significado | Estado |
    |---|---|---|
    | 200 | OK (listado, ficha, salud) | En uso (fase 1) |
    | 201 | Creado (registro de una cuenta; orden PENDING al iniciar el pago) | En uso (fases 2-3) |
    | 302 | Redirección del navegador (retorno de Webpay hacia la SPA) | En uso (fase 3) |
    | 400 | Regla de negocio violada (stock insuficiente al crear la orden) | En uso (fase 3) |
    | 401 | Sin sesión o credenciales incorrectas | En uso (fase 2) |
    | 403 | Con sesión, pero sin permiso | En uso (fase 2) |
    | 404 | Recurso inexistente | En uso (fase 1) |
    | 409 | Conflicto (email ya registrado; transición ilegal de pedido) | En uso (fases 2 y 4) |
    | 422 | Datos mal formados (validación de esquema) | En uso (fase 1) |
    | 429 | Cuota del free tier del servicio de IA consumida — el asistente la traduce a mensaje amable, sin cifras de límites | En uso (fase 4) |
    | 503 | Servicio externo del asistente no disponible (sin API key o servicio caído — degradación D-61) | En uso (fase 4) |

servers:
  - url: http://localhost:8000
    description: Desarrollo local
  - url: https://TU-API.example.com
    description: Producción (placeholder — se define en la fase 5 de despliegue)

tags:
  - name: Productos
    description: Catálogo público con filtros (STORE-02, STORE-03)
  - name: Autenticación
    description: Cuentas de clienta con JWT — registro, login, sesión y claim de rol (AUTH-01, AUTH-02, AUTH-03)
  - name: Pago
    description: Checkout y retorno de Webpay Plus en ambiente de integración (PAY-01, PAY-02, PAY-03, PAY-04, CART-03)
  - name: Pedidos
    description: Historial y detalle de los pedidos de la clienta, con estados honestos (ORDR-01, ORDR-02)
  - name: Administración
    description: Panel de la dueña — CRUD de productos con soft delete, gestión de pedidos con transición validada y métricas, todo protegido por rol admin (ADMN-01, ADMN-02, ADMN-03, ADMN-04)
  - name: Asistente
    description: La asesora de venta con IA — recomienda aromas del catálogo real vía el servicio de IA; endpoint público con topes de entrada y degradación amable (AIAS-01, AIAS-02, AIAS-03)
  - name: Operación
    description: Chequeo del servicio

# ---------------------------------------------------------------------------
# Esquemas
# ---------------------------------------------------------------------------
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT de larga vida (7 días, D-20) que emite `/api/auth/login`. Viaja en
        la cabecera `Authorization: Bearer <token>`. No existe endpoint de
        renovación (D-19). Declarado como `type: http` + `scheme: bearer`,
        la forma correcta de OpenAPI 3.0 para un JWT — no un esquema de API key.
  schemas:
    Error:
      type: object
      properties:
        detail:
          type: string
          example: Producto no encontrado
      required: [detail]

    ProductoResumen:
      type: object
      description: Como aparece un producto en la grilla del catálogo (STORE-02)
      properties:
        id:
          type: integer
          example: 1
        sku:
          type: string
          description: Clave natural del producto; el seed converge por upsert sobre ella (STORE-04)
          example: citricas-01
        nombre:
          type: string
          example: Brisa de Naranja
        precio:
          type: integer
          description: Precio en pesos chilenos (CLP), entero sin decimales
          example: 7990
        familia:
          type: string
          description: Slug ASCII de la familia aromática — por el cable viaja sin acentos; la SPA muestra la etiqueta ("Cítricas")
          enum: [citricas, florales, frutales, dulces]
          example: citricas
        imagen:
          type: string
          description: Ruta local de la foto (servida por el host del SPA); sin hotlinks externos (D-08)
          example: /products/citricas-01.jpg
      required: [id, sku, nombre, precio, familia, imagen]

    ProductoDetalle:
      allOf:
        - $ref: '#/components/schemas/ProductoResumen'
        - type: object
          description: La ficha completa del producto (STORE-03)
          properties:
            descripcion:
              type: string
              description: 1-2 frases en español de Chile, tono cercano
              example: Naranja recién pelada con un fondo de bergamota. Frescura luminosa para el día.
            notas:
              type: array
              description: Notas aromáticas que componen la fragancia
              items:
                type: string
              example: [naranja, bergamota, mandarina]
            stock:
              type: integer
              description: Unidades disponibles para la venta
              example: 14
          required: [descripcion, notas, stock]

    UsuarioPublico:
      type: object
      description: La cuenta tal como la ve el mundo — id, email y rol; el hash de la contraseña jamás cruza esta frontera (AUTH-01, AUTH-02)
      properties:
        id:
          type: integer
          example: 2
        email:
          type: string
          format: email
          description: Correo de la clienta; único en el sistema y clave del upsert del seed de cuentas (D-23, D-24)
          example: clienta@maura.cl
        rol:
          type: string
          description: Rol que viaja como claim en el token desde que se emite (AUTH-03)
          enum: [cliente, admin]
          example: cliente
      required: [id, email, rol]

    Token:
      type: object
      description: El JWT que abre los endpoints protegidos; lo devuelve el login (AUTH-02)
      properties:
        access_token:
          type: string
          description: Token firmado HS256 con los claims sub, rol, exp e iat; expira a los 7 días (D-20)
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIyIiwicm9sIjoiY2xpZW50ZSJ9.firmado-por-el-backend
        token_type:
          type: string
          description: Tipo de token para la cabecera Authorization
          example: bearer
      required: [access_token, token_type]

    RegistroCreate:
      type: object
      description: Lo que envía el formulario de registro — email y contraseña de la nueva cuenta (AUTH-01)
      properties:
        email:
          type: string
          format: email
          description: Correo de la clienta; si ya tiene cuenta, el registro responde 409 (D-26)
          example: clienta@maura.cl
        password:
          type: string
          minLength: 8
          description: Largo mínimo 8 y sin reglas de composición — longitud sobre complejidad (D-25)
          example: una-clave-larga
      required: [email, password]

    CheckoutCreate:
      type: object
      description: |
        Lo que la SPA envía al iniciar el pago (CART-03): el carro tal como
        vive en el navegador — SOLO pares {producto_id, cantidad} (D-27,
        RN-08). No existe campo de precio ni total en este schema: el
        servidor consulta el catálogo, recarga el precio vigente y
        recalcula el total; el monto que viaja a Webpay sale únicamente de
        ese recálculo, jamás de lo que mande el cliente.
      properties:
        items:
          type: array
          minItems: 1
          description: Pares producto-cantidad del carro persistido en localStorage (ADR-010)
          items:
            type: object
            properties:
              producto_id:
                type: integer
                description: Id del producto en el catálogo
                example: 1
              cantidad:
                type: integer
                minimum: 1
                description: Unidades a comprar
                example: 2
            required: [producto_id, cantidad]
      required: [items]

    CheckoutRespuesta:
      type: object
      description: Los tres datos que la SPA necesita para armar el form POST hacia Webpay (PAY-01) — el numero es el de la orden recién nacida en estado pending (D-34)
      properties:
        url:
          type: string
          description: URL del formulario hosted de Webpay; es el action del form POST que la SPA construye y submitea
          example: https://webpay3gint.transbank.cl/webpayserver/init_transaction.cgi
        token_ws:
          type: string
          description: Token de la transacción; viaja como input hidden de nombre token_ws — el nombre exacto que exige Webpay en el wire
          example: 01abd2e7cc25bbf19f3c...
        numero:
          type: string
          description: Número legible de la orden recién creada (D-37); a la vez es el buy_order que viajó a Webpay
          example: MAURA-000001
      required: [url, token_ws, numero]

    OrdenLista:
      type: object
      description: Una orden tal como aparece en el historial de pedidos (ORDR-01) — liviana, sin líneas
      properties:
        numero:
          type: string
          description: Número público legible (D-37) — jamás el id interno de la BD
          example: MAURA-000001
        fecha:
          type: string
          format: date-time
          description: Momento en que la orden nació al iniciar el pago (D-34)
          example: '2026-09-30T14:49:29Z'
        total:
          type: integer
          description: Total en CLP recalculado por el servidor con el precio vigente al comprar (CART-03)
          example: 15980
        estado:
          type: string
          description: Estado real de la orden, en minúsculas por el cable — pending se muestra en pantalla como "en curso" (D-48)
          enum: [pending, paid, cancelled, rejected]
          example: paid
      required: [numero, fecha, total, estado]

    OrdenDetalle:
      allOf:
        - $ref: '#/components/schemas/OrdenLista'
        - type: object
          description: La orden completa que renderizan el voucher y el detalle del historial (D-43) — las líneas traen el snapshot congelado al comprar
          properties:
            lineas:
              type: array
              description: Líneas del pedido con nombre y precio congelados al momento de comprar (D-36) — lo que se pagó, no lo que vale hoy
              items:
                type: object
                properties:
                  nombre_snapshot:
                    type: string
                    description: Nombre del producto congelado al comprar (D-36); el detalle jamás consulta el catálogo vigente
                    example: Brisa de Naranja
                  precio_snapshot:
                    type: integer
                    description: Precio en CLP pagado por unidad — lo que se pagó, no el precio vigente (D-36)
                    example: 7990
                  cantidad:
                    type: integer
                    description: Unidades compradas de este producto
                    example: 2
                required: [nombre_snapshot, precio_snapshot, cantidad]
          required: [lineas]

    ProductoCrear:
      type: object
      description: |
        Lo que envía el formulario "Nuevo producto" del panel (ADMN-01). El
        producto nuevo nace SIEMPRE activo: no existe campo de estado
        comercial en este schema — el toggle activo/inactivo vive en su
        propio endpoint (D-52). La imagen es una ruta de texto (D-51):
        sin upload de archivos, el seed ya baja las fotos (D-08).
      properties:
        nombre:
          type: string
          description: Nombre comercial del aroma, tal como aparece en el catálogo
          example: Brisa de Naranja
        descripcion:
          type: string
          description: 1-2 frases en español de Chile, tono cercano — la misma voz del catálogo
          example: Naranja recién pelada con un fondo de bergamota. Frescura luminosa para el día.
        familia:
          type: string
          description: Slug ASCII de la familia aromática — el mismo enum cerrado del catálogo público (RN-01)
          enum: [citricas, florales, frutales, dulces]
          example: citricas
        precio:
          type: integer
          minimum: 0
          description: Precio en pesos chilenos (CLP), entero sin decimales
          example: 7990
        stock:
          type: integer
          minimum: 0
          description: Unidades disponibles para la venta
          example: 14
        notas:
          type: array
          description: Notas aromáticas que componen la fragancia — el panel las recibe separadas por comas
          items:
            type: string
          example: [naranja, bergamota, mandarina]
        imagen:
          type: string
          description: Ruta local de la foto dentro del sitio (D-51 — campo de texto, sin upload)
          example: /products/citricas-01.jpg
      required: [nombre, descripcion, familia, precio, stock, notas, imagen]

    ProductoEditar:
      type: object
      description: |
        Lo que el panel puede escribir de un producto existente (ADMN-01):
        la MISMA allow-list de campos de ProductoCrear — SIN id y SIN campo
        de estado comercial. El toggle activo/inactivo vive en su propio
        endpoint (PATCH /api/admin/productos/{producto_id}/activo, D-52).
        Una regla demostrada por AUSENCIA de campo — la misma lección
        estructural de CheckoutCreate sin precio (CART-03): lo que el
        cuerpo no puede llevar, el mass assignment no puede voltear. El
        id del producto es del path, jamás del cuerpo.
      properties:
        nombre:
          type: string
          description: Nombre comercial del aroma
          example: Brisa de Naranja
        descripcion:
          type: string
          description: 1-2 frases en español de Chile, tono cercano
          example: Naranja recién pelada con un fondo de bergamota. Frescura luminosa para el día.
        familia:
          type: string
          description: Slug ASCII de la familia aromática — el mismo enum cerrado del catálogo público (RN-01)
          enum: [citricas, florales, frutales, dulces]
          example: citricas
        precio:
          type: integer
          minimum: 0
          description: Precio en pesos chilenos (CLP), entero sin decimales
          example: 7990
        stock:
          type: integer
          minimum: 0
          description: Unidades disponibles para la venta
          example: 14
        notas:
          type: array
          description: Notas aromáticas que componen la fragancia — separadas por comas en el formulario
          items:
            type: string
          example: [naranja, bergamota, mandarina]
        imagen:
          type: string
          description: Ruta local de la foto dentro del sitio (D-51 — campo de texto, sin upload)
          example: /products/citricas-01.jpg
      required: [nombre, descripcion, familia, precio, stock, notas, imagen]

    ProductoAdmin:
      type: object
      description: |
        Un producto tal como lo ve la dueña en el listado del panel
        (ADMN-01, ADMN-02) — TODOS los productos, incluidos los inactivos
        (D-52): el catálogo público filtra activos, el panel ve la
        trastienda completa. Por eso suma el campo de estado comercial y
        el stock que el resumen público no muestra.
      properties:
        id:
          type: integer
          description: Id interno del producto — visible para admin, jamás en las pantallas de tienda
          example: 1
        nombre:
          type: string
          description: Nombre comercial del aroma
          example: Brisa de Naranja
        familia:
          type: string
          description: Slug ASCII de la familia aromática
          enum: [citricas, florales, frutales, dulces]
          example: citricas
        precio:
          type: integer
          description: Precio en pesos chilenos (CLP), entero sin decimales
          example: 7990
        stock:
          type: integer
          description: Unidades disponibles — el panel marca "Stock bajo" cuando hay 5 o menos y el producto está activo (D-53)
          example: 4
        imagen:
          type: string
          description: Ruta local de la foto dentro del sitio (D-51)
          example: /products/citricas-01.jpg
        activo:
          type: boolean
          description: Estado comercial visible — soft delete (D-52); false saca el producto del catálogo público sin destruir su historial y los pedidos viejos conservan su snapshot (D-36)
          example: true
      required: [id, nombre, familia, precio, stock, imagen, activo]

    PedidoAdmin:
      type: object
      description: |
        Un pedido tal como lo ve la dueña en el panel (ADMN-03): lo mismo
        que OrdenLista (numero, fecha, total, estado) MÁS el email de la
        clienta dueña del pedido — un dato que solo el rol admin puede
        ver, porque la dueña es dueña del negocio entero, no de una cuenta
        (D-55). Sin vista de detalle en el panel: la fila ya lleva todo lo
        que la gestión necesita.
      properties:
        numero:
          type: string
          description: Número público legible (D-37) — jamás el id interno de la BD
          example: MAURA-000001
        fecha:
          type: string
          format: date-time
          description: Momento en que la orden nació al iniciar el pago (D-34)
          example: '2026-09-30T14:49:29Z'
        email_clienta:
          type: string
          format: email
          description: La dueña del pedido — email de la cuenta que inició el checkout; visible solo para admin
          example: clienta@maura.cl
        total:
          type: integer
          description: Total en CLP recalculado por el servidor al comprar (CART-03)
          example: 15980
        estado:
          type: string
          description: Estado real de la orden, en minúsculas por el cable — la máquina de estados completa en ADR-016 (D-50)
          enum: [pending, paid, cancelled, rejected]
          example: pending
      required: [numero, fecha, email_clienta, total, estado]

    PedidoTransicion:
      type: object
      description: |
        Lo que envía el panel al transicionar un pedido (ADMN-03, D-50).
        El enum acepta UN solo valor — cancelled — porque el admin posee
        exactamente UNA transición manual en la máquina de estados:
        PENDING → CANCELLED, la gestión de las huérfanas que la fase 3
        dejó visibles como "en curso". Las demás transiciones pertenecen
        al flujo de pago (ADR-012/ADR-013) y PAID es terminal en v1 (el
        refund es ADMN-05, diferido a v2).
      properties:
        estado:
          type: string
          enum: [cancelled]
          description: Único destino manual posible — anular un pedido en curso; pedir otra cosa es 422 aquí, y pedirlo sobre un pedido que ya no está en curso es 409 en el endpoint
          example: cancelled
      required: [estado]

    Metricas:
      type: object
      description: |
        Los cuatro KPI del panel de administración (ADMN-04, D-54) —
        tarjetas y tabla, sin gráficos (STAKE-04 diferido a v2). Todo
        computable desde las tablas existentes: pedidos y líneas con
        snapshot.
      properties:
        ingresos_totales:
          type: integer
          description: Suma de los totales de las órdenes PAID, en CLP — sin excepciones manuales que la falseen (D-50)
          example: 31960
        pedidos_por_estado:
          type: object
          description: Contador por cada uno de los 4 estados de la máquina (D-50) — siempre los cuatro, aunque sean 0
          properties:
            pending:
              type: integer
              description: Órdenes en curso — las huérfanas incluidas, hasta que la dueña las anule
              example: 1
            paid:
              type: integer
              description: Órdenes pagadas — las únicas que suman ingresos
              example: 2
            cancelled:
              type: integer
              description: Órdenes anuladas (por el flujo de Webpay o por el admin)
              example: 0
            rejected:
              type: integer
              description: Órdenes que perdieron la carrera de stock (D-35)
              example: 0
          required: [pending, paid, cancelled, rejected]
        top_5:
          type: array
          maxItems: 5
          description: Los 5 aromas más vendidos por unidades, computados desde el snapshot de las líneas de órdenes PAID (D-36/D-54) — el nombre es el congelado al vender, aunque el producto ya esté inactivo
          items:
            type: object
            properties:
              nombre:
                type: string
                description: Nombre snapshot congelado al comprar (D-36) — histórico, sin link a ficha
                example: Brisa de Naranja
              unidades:
                type: integer
                description: Unidades vendidas en órdenes PAID
                example: 4
            required: [nombre, unidades]
        productos_stock_bajo:
          type: integer
          description: Productos ACTIVOS con 5 unidades o menos — el umbral fijo del backend (D-53), distinto del "últimas unidades" de la tienda
          example: 3
      required: [ingresos_totales, pedidos_por_estado, top_5, productos_stock_bajo]

    ChatMensaje:
      type: object
      description: |
        Lo que envía la burbuja del chat a la asesora (AIAS-01, D-58/D-59).
        Multi-turno stateless: el historial visible viaja en cada request —
        el backend NO guarda conversaciones (cero tablas para el
        asistente). Los topes (mensaje de hasta 500 caracteres, historial
        de hasta 10 mensajes con su texto al mismo tope de 500) protegen
        el free tier del servicio de IA y validan aquí, en el borde, como 422
        declarativo.
      properties:
        mensaje:
          type: string
          maxLength: 500
          description: El mensaje nuevo de la visitante — máximo 500 caracteres
          example: ¿Qué recomiendas si me gusta lo cítrico?
        historial:
          type: array
          maxItems: 10
          description: Los últimos mensajes de la conversación (máximo 10), tal como los mantiene el navegador — no existe sesión de chat en el servidor
          items:
            type: object
            properties:
              rol:
                type: string
                enum: [clienta, asesora]
                description: Quién escribió el mensaje en la conversación visible
                example: clienta
              texto:
                type: string
                maxLength: 500
                description: El contenido del mensaje — máximo 500 caracteres (el mismo tope del mensaje nuevo, RN-16)
                example: Busco un regalo para mi mamá
            required: [rol, texto]
      required: [mensaje]

    ChatRespuesta:
      type: object
      description: |
        La respuesta de la asesora (AIAS-02). El texto habla con la voz de
        Maura (D-02) y los productos son ids del catálogo ACTIVO ya
        validados por el backend contra la BD antes de responder (D-56) —
        la muralla anti-alucinación es del servidor: el chat solo
        renderiza cards que existen (máximo 3).
      properties:
        respuesta:
          type: string
          description: El texto de la recomendación — primera persona, tuteo chileno, solo del catálogo real
          example: Si te gusta lo cítrico, prueba la Brisa de Naranja — naranja recién pelada con un fondo de bergamota, fresca y luminosa para el día.
        productos:
          type: array
          maxItems: 3
          description: Ids de productos del catálogo activo citados en la respuesta (máximo 3), ya validados contra la BD por el backend antes de responder
          items:
            type: integer
            description: Id del producto en el catálogo — existe y está activo, garantizado por el servidor
            example: 1
      required: [respuesta, productos]

# ---------------------------------------------------------------------------
# Operaciones
# ---------------------------------------------------------------------------
paths:
  /api/salud:
    get:
      tags: [Operación]
      summary: Chequeo de vida del servicio
      responses:
        '200':
          description: Servicio arriba
          content:
            application/json:
              schema:
                type: object
                properties:
                  estado: { type: string, example: ok }

  /api/productos:
    get:
      tags: [Productos]
      summary: Listar el catálogo con filtros
      description: |
        STORE-02 · Público. Devuelve solo productos activos, orden estable por id.
        Filtros combinables: familia, rango de precio (CLP entero, mínimo 0).
        Filtro mal formado (familia fuera del enum o precio negativo) → 422,
        producido por la validación declarativa (Pydantic), sin código manual.
      parameters:
        - name: familia
          in: query
          required: false
          description: Slug ASCII de la familia aromática (sin acentos)
          schema:
            type: string
            enum: [citricas, florales, frutales, dulces]
          example: citricas
        - name: precio_min
          in: query
          required: false
          description: Precio mínimo incluyente (CLP entero)
          schema:
            type: integer
            minimum: 0
          example: 8000
        - name: precio_max
          in: query
          required: false
          description: Precio máximo incluyente (CLP entero)
          schema:
            type: integer
            minimum: 0
          example: 11000
      responses:
        '200':
          description: Productos activos que cumplen los filtros
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductoResumen'
        '422':
          description: Filtro mal formado (familia fuera del enum, precio negativo)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/productos/{producto_id}:
    get:
      tags: [Productos]
      summary: Ver la ficha de un producto
      description: |
        STORE-03 · Público. Incluye descripción, notas aromáticas y stock
        además de los campos del resumen.
      parameters:
        - name: producto_id
          in: path
          required: true
          schema: { type: integer }
          example: 1
      responses:
        '200':
          description: La ficha completa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductoDetalle'
        '404':
          description: Producto inexistente (o inactivo)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/registro:
    post:
      tags: [Autenticación]
      summary: Crear una cuenta de clienta
      description: |
        AUTH-01 · Público. Recibe el email y la contraseña de la nueva cuenta;
        la contraseña se guarda hasheada (Argon2) en el backend y jamás vuelve
        en ninguna respuesta. Un email ya registrado responde 409 con un
        mensaje que invita a iniciar sesión en vez de adivinar otra clave (D-26).
        Email sin formato o contraseña menor a 8 caracteres → 422, producido
        por la validación declarativa (Pydantic), sin código manual.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroCreate'
      responses:
        '201':
          description: Cuenta creada — la clienta tal como la ve el mundo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioPublico'
        '409':
          description: El email ya tiene cuenta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: Ese email ya tiene cuenta, inicia sesión
        '422':
          description: |
            Cuerpo mal formado (email sin formato, contraseña menor a 8
            caracteres). Desvío documentado: el 422 real de FastAPI trae
            `detail` como array de validación ([{loc, msg, type}, …]);
            el contrato lo simplifica como Error (detail string).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/login:
    post:
      tags: [Autenticación]
      summary: Iniciar sesión y recibir el token
      description: |
        AUTH-02 · Público. Formulario OAuth2 (application/x-www-form-urlencoded):
        el campo `username` transporta el email de la clienta — así el botón
        Authorize de `/docs` funciona con las cuentas del seed y el flujo
        calza con el tutorial oficial de FastAPI. Ante cualquier falla
        responde 401 genérico, sin revelar si el email existe (D-26).
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                username:
                  type: string
                  format: email
                  description: El email de la clienta (OAuth2 llama username a este campo)
                  example: clienta@maura.cl
                password:
                  type: string
                  description: Contraseña en texto plano; viaja una sola vez y se verifica contra el hash en el backend
                  example: una-clave-larga
              required: [username, password]
      responses:
        '200':
          description: Sesión iniciada — el token de larga vida (7 días, D-20)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '401':
          description: Email o contraseña incorrectos — mensaje genérico deliberado (D-26)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: Credenciales incorrectas

  /api/auth/perfil:
    get:
      tags: [Autenticación]
      summary: Ver el perfil de la sesión actual
      description: |
        AUTH-02 · Requiere sesión (Bearer). Devuelve la cuenta que vive dentro
        del token: con token válido la clienta ve su propio perfil; con token
        ausente, inválido o expirado → 401.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: La cuenta de la sesión
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioPublico'
        '401':
          description: Sin sesión, o token inválido/expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: Credenciales incorrectas

  /api/admin/productos:
    get:
      tags: [Administración]
      summary: Listar TODOS los productos del panel (incluye inactivos)
      description: |
        ADMN-01, ADMN-02 · Requiere sesión con rol admin (Bearer). El
        listado del panel ve la trastienda completa: TODOS los productos,
        activos e inactivos (D-52) — el catálogo público sigue filtrando
